# C-hjkl moves between panes, handing the key to nvim or a nested tmux when that
# pane can still move that way. Both advertise it as a "tmuxnav:LRUD" pane title.

%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
%hidden is_nested="#{m/r:^(ssh|mosh-client|tmux)$,#{pane_current_command}}"
%hidden unmarked="#{!:#{m/r:^tmuxnav:,#{pane_title}}}"

bind -n C-h if -F "$is_nested" {
    if -F "#{m/r:^tmuxnav:[A-Z]*L,#{pane_title}}" { send C-h } { select-pane -L }
} {
    if "$is_vim" {
        if -F "#{||:#{m/r:^tmuxnav:[A-Z]*L,#{pane_title}},$unmarked}" { send C-h } { select-pane -L }
    } { select-pane -L }
}

bind -n C-l if -F "$is_nested" {
    if -F "#{m/r:^tmuxnav:[A-Z]*R,#{pane_title}}" { send C-l } { select-pane -R }
} {
    if "$is_vim" {
        if -F "#{||:#{m/r:^tmuxnav:[A-Z]*R,#{pane_title}},$unmarked}" { send C-l } { select-pane -R }
    } { select-pane -R }
}

bind -n C-k if -F "$is_nested" {
    if -F "#{m/r:^tmuxnav:[A-Z]*U,#{pane_title}}" { send C-k } { select-pane -U }
} {
    if "$is_vim" {
        if -F "#{||:#{m/r:^tmuxnav:[A-Z]*U,#{pane_title}},$unmarked}" { send C-k } { select-pane -U }
    } { select-pane -U }
}

bind -n C-j if -F "$is_nested" {
    if -F "#{m/r:^tmuxnav:[A-Z]*D,#{pane_title}}" { send C-j } { select-pane -D }
} {
    if "$is_vim" {
        if -F "#{||:#{m/r:^tmuxnav:[A-Z]*D,#{pane_title}},$unmarked}" { send C-j } { select-pane -D }
    } { select-pane -D }
}

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-j select-pane -D

# over ssh, advertise to the outer tmux which directions this one can absorb
%hidden absorbs="#{m/r:^(n?vim|ssh|mosh-client|tmux)$,#{pane_current_command}}"
if '[ -n "$SSH_CONNECTION" ]' {
    set -g set-titles on
    set -as terminal-features ',*:title'
    set -g set-titles-string "tmuxnav:"
    set -ag set-titles-string "#{?#{||:#{!:#{pane_at_left}},#{&&:$absorbs,#{m/r:^tmuxnav:[A-Z]*L,#{pane_title}}}},L,}"
    set -ag set-titles-string "#{?#{||:#{!:#{pane_at_right}},#{&&:$absorbs,#{m/r:^tmuxnav:[A-Z]*R,#{pane_title}}}},R,}"
    set -ag set-titles-string "#{?#{||:#{!:#{pane_at_top}},#{&&:$absorbs,#{m/r:^tmuxnav:[A-Z]*U,#{pane_title}}}},U,}"
    set -ag set-titles-string "#{?#{||:#{!:#{pane_at_bottom}},#{&&:$absorbs,#{m/r:^tmuxnav:[A-Z]*D,#{pane_title}}}},D,}"
}
